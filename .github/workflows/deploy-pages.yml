name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build static root-domain edition
        run: npm run build:static && npm run check:static

      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Exercise the static artifact in real Chromium
        timeout-minutes: 5
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/scripture-static-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          npm run test:static:browser -- http://127.0.0.1:4173/

      - name: Retain browser test traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripture-journey-browser-tests
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain static site for review (does not deploy)
        uses: actions/upload-artifact@v4
        with:
          name: scripture-journey-static
          path: out/
          include-hidden-files: true
